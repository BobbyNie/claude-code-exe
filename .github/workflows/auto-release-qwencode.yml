name: Auto Release Qwen Code Portable

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-release-qwencode.yml'
      - 'scripts/qwen/**'

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for new version
        id: check_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $versionOutput = .\scripts\qwen\check-version.ps1
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            $version = $versionOutput | Select-Object -Last 1
            echo "new_version=true" >> $env:GITHUB_OUTPUT
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "New Qwen Code version detected: $version"
          } elseif ($code -eq 1 -and ($versionOutput -match 'already exists')) {
            echo "new_version=false" >> $env:GITHUB_OUTPUT
            echo "No new Qwen Code version available"
          } else {
            Write-Error "Qwen version check failed:`n$versionOutput"
            exit 1
          }
          exit 0

      - name: Download and build qwen.exe
        if: steps.check_version.outputs.new_version == 'true'
        shell: pwsh
        run: |
          .\scripts\qwen\download.ps1 -Version ${{ steps.check_version.outputs.version }} -OutputDir .

      - name: Prepare portable package
        if: steps.check_version.outputs.new_version == 'true'
        shell: pwsh
        run: |
          mkdir release

          Copy-Item qwen.exe release\
          Copy-Item scripts\qwen\wrapper.bat release\
          Set-Content -Path release\launcher.revision -Value "3" -Encoding ASCII -NoNewline

          @"
          Qwen Code ${{ steps.check_version.outputs.version }} Portable
          ====================================================

          使用 wrapper.bat 启动以获得完整的便携体验：
          双击 wrapper.bat 或在命令行运行 wrapper.bat

          所有配置和数据将存储在 data\ 目录下。
          "@ | Out-File -Encoding UTF8 release\README.txt

      - name: Create Release
        if: steps.check_version.outputs.new_version == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.check_version.outputs.version }}"
          $tag = "qwencode-v$version"
          $title = "Qwen Code $version Portable"

          if (gh release view "$tag" 2>$null) {
            Write-Output "Removing outdated release $tag before republishing qwen.exe"
            gh release delete "$tag" -y --cleanup-tag
          }

          $notes = @"
          ## Qwen Code $version Portable

          自动从官方 Qwen Code Windows 独立版封装为便携版。

          ### 文件说明
          - ``qwen.exe`` - 主程序（内嵌官方运行时，首次运行解压到 ``.qwen-runtime``）
          - ``wrapper.bat`` - 启动脚本（推荐使用）

          ### 使用方法
          推荐使用 ``wrapper.bat`` 启动，确保所有数据存储在便携目录内。

          ### 官方链接
          - [Qwen Code 官网](https://qwen.ai/qwencode)
          - [官方仓库](https://github.com/QwenLM/qwen-code)

          ---
          自动发布于 $(Get-Date -Format "yyyy-MM-dd HH:mm:ss") UTC
          "@

          gh release create "$tag" `
            --title "$title" `
            --notes "$notes" `
            release\qwen.exe `
            release\wrapper.bat `
            release\launcher.revision `
            release\README.txt

          echo "Release $tag created successfully"
