name: Append ccode to AI Tools Portable Release

on:
  workflow_run:
    workflows:
      - Auto Release AI Tools Portable
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append-ccode:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve current bundle release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          . .\scripts\check-all-versions.ps1 -NoExit
          $bundle = Get-LatestBundleInfo
          if (-not (gh release view $bundle.ReleaseTag 2>$null)) {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Output "Bundle release does not exist; nothing to append."
            exit 0
          }
          "exists=true" >> $env:GITHUB_OUTPUT
          "tag=$($bundle.ReleaseTag)" >> $env:GITHUB_OUTPUT
          "version=$($bundle.ClaudeVersion)" >> $env:GITHUB_OUTPUT

      - name: Configure MSVC
        if: steps.release.outputs.exists == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build ccode.exe
        if: steps.release.outputs.exists == 'true'
        shell: pwsh
        run: |
          .\scripts\ccode\build.ps1 -Version "${{ steps.release.outputs.version }}" -OutputDir .

      - name: Install filesystem regression test runtime
        if: steps.release.outputs.exists == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'

      - name: Run ccode tests
        if: steps.release.outputs.exists == 'true'
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          .\scripts\ccode\test-windows.ps1 -Executable .\ccode.exe

      - name: Append ccode.exe to existing release
        if: steps.release.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" .\ccode.exe --clobber
