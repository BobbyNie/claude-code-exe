name: Test ccode Windows runtime

on:
  push:
    branches: ['codex/fix-ccode-runtime-paths', 'codex/unified-sandbox-design']
  pull_request:
    paths: ['scripts/ccode/**', 'tests/ccode/**', '.github/workflows/test-ccode.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['2.1.221', '2.1.282']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build reported runtime version
        shell: pwsh
        run: ./scripts/ccode/build.ps1 -Version '${{ matrix.version }}' -OutputDir .
      - name: Test native runtime and resume
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
          ./scripts/ccode/test-windows.ps1 -Executable ./ccode.exe
      - name: Test portable frontend contract
        shell: pwsh
        run: python tests/ccode/portable-integration.py ./ccode.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ccode-windows-tested-${{ matrix.version }}
          path: ccode.exe
