name: Test ccode Windows runtime

on:
  push:
    branches: ['codex/fix-ccode-runtime-paths', 'codex/unified-sandbox-design']
  pull_request:
    paths: ['scripts/ccode/**', 'tests/ccode/**', '.github/workflows/test-ccode.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['2.1.221', '2.1.282']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.0'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Build reported runtime version
        id: build
        shell: pwsh
        run: ./scripts/ccode/build.ps1 -Version '${{ matrix.version }}' -AdapterRevision '${{ github.sha }}' -OutputDir .
      - name: Test manifest signature contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          node --test tests/ccode/manifest-signature.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Manifest signature contracts failed' }
      - name: Test Python contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
      - name: Test native runtime and resume
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/ccode/test-windows.ps1 -Executable ./ccode.exe
      - name: Test portable frontend contract
        shell: pwsh
        run: python tests/ccode/portable-integration.py ./ccode.exe
      - name: Exercise actual engine tools through the frontend
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: python tests/ccode/tools-integration.py ./ccode.exe
      - name: Verify actual MCP allow and deny
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: python tests/ccode/tools-integration.py ./ccode.exe --mcp-only
      - name: Verify actual Skill body loading
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: python tests/ccode/tools-integration.py ./ccode.exe --skill-only
      - name: Verify actual subagent execution
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: python tests/ccode/tools-integration.py ./ccode.exe --subagent-only
      - name: Verify workspace aliases
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: python tests/ccode/tools-integration.py ./ccode.exe --workspace-aliases-only
      - name: Reject tampered embedded payload
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: python tests/ccode/payload-integrity.py ./ccode.exe
      - name: Verify actual engine DNS rejection
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: python tests/ccode/gateway-integration.py ./ccode.exe --dns-only
      - name: Verify actual engine gateway rejection
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: python tests/ccode/gateway-integration.py ./ccode.exe
      - name: Collect privacy-safe native TLS event evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: python tests/ccode/tls-probe.py ./ccode.exe
      - name: Verify session writer concurrency
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: python tests/ccode/concurrency-integration.py ./ccode.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: ccode-windows-built-${{ matrix.version }}
          path: ccode.exe
          if-no-files-found: error

  workspace-boundary:
    # Keep this acceptance gate required/failing, but do not let an OS cwd limit
    # hide the independent lifecycle and cross-version regression results.
    needs: test
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        version: ['2.1.221', '2.1.282']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ccode-windows-built-${{ matrix.version }}
          path: workspace-boundary-bin
      - name: Verify explicit workspace cwd boundaries
        shell: pwsh
        run: python tests/ccode/tools-integration.py ./workspace-boundary-bin/ccode.exe --workspace-boundary-only

  cross-version:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ccode-windows-built-2.1.221
          path: cross/old
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ccode-windows-built-2.1.282
          path: cross/new
      - name: Exercise actual upgrade and rollback between both engines
        shell: pwsh
        run: |
          python tests/ccode/resume-integration.py prepare ./cross/new/ccode.exe
          if ($LASTEXITCODE -ne 0) { throw 'Cross-version fixture preparation failed' }
          python tests/ccode/resume-integration.py verify ./cross/new/ccode.exe ./cross/old/ccode.exe
          if ($LASTEXITCODE -ne 0) { throw 'Actual cross-version rollback failed' }
