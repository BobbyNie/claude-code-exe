name: Check GitHub Releases

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Auto Release AI Tools Portable]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify-releases:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify releases match official latest versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          .\scripts\check-github-releases.ps1
